name: Integração contínua
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    env:
      DJANGO_DEBUG: 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test -v 2
  build:
    env:
      DJANGO_DEBUG: 'true'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bookstore:ci .
      - name: Executar imagem e verificar API
        shell: bash
        run: |
          docker run -d -e DJANGO_DEBUG=true --name bookstore-image -p 127.0.0.1:8000:8000 bookstore:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/products/ > /tmp/bookstore-response.json; then
              cat /tmp/bookstore-response.json
              exit 0
            fi
            sleep 1
          done
          docker logs bookstore-image
          exit 1
      - if: always()
        run: docker rm -f bookstore-image || true
  compose:
    env:
      DJANGO_DEBUG: 'true'
    runs-on: ubuntu-latest
    needs: test
    env:
      POSTGRES_PASSWORD: ci-ephemeral-postgres-only
    steps:
      - uses: actions/checkout@v4
      - name: Subir aplicação e PostgreSQL
        run: docker compose up -d --build
      - name: Verificar API e testar PostgreSQL
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8000/api/products/; then
              docker compose exec -T web python manage.py test -v 2
              docker compose exec -T web python -c "import socket; print('db DNS:',socket.gethostbyname('db'))"
              docker network inspect ebac-bookstore_bookstore_net
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v


