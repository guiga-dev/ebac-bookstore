name: Entrega contínua Heroku
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
      HEROKU_EMAIL: ${{ secrets.HEROKU_EMAIL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publicar na aplicação configurada
        shell: bash
        run: |
          test -n "$HEROKU_API_KEY" && test -n "$HEROKU_APP_NAME" && test -n "$HEROKU_EMAIL"
          printf 'machine git.heroku.com
  login %s
  password %s
' "$HEROKU_EMAIL" "$HEROKU_API_KEY" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git push "https://git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:main
          rm -f "$HOME/.netrc"
